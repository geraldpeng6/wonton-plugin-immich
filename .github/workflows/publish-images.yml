name: 发布镜像

# 公开仓库用 GitHub 托管的 runner 和 GITHUB_TOKEN 构建多架构镜像，推到 GHCR。发布后把清单列表的摘要写进 compose。
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 读版本
        id: version
        run: |
          echo "version=$(sed -n 's/^  version: //p' docker-compose.yml | head -1)" >>"$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: images/immich-mcp
          file: images/immich-mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/geraldpeng6/immich-mcp:${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - run: echo "摘要 ${{ steps.build.outputs.digest }}" >>"$GITHUB_STEP_SUMMARY"
